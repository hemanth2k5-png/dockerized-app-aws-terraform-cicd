name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-2
  ECR_REPOSITORY: dockerized-app
  INSTANCE_NAME: dockerized-app-app # CHECK: must match the Name tag from Step 1

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest

  build-deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image tagged with commit SHA
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" app
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Find target instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running instance with Name tag $INSTANCE_NAME"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy container with SSM Run Command
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          cat > params.json <<EOF
          {"commands":[
            "set -e",
            "export HOME=/root",
            "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY",
            "docker pull $IMAGE",
            "docker rm -f app || true",
            "docker run -d --name app --restart unless-stopped -p 80:8000 $IMAGE",
            "docker ps --filter name=app"
          ]}
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE_TAG" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)
          echo "SSM command id: $CMD_ID"
          if ! aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"; then
            echo "Deploy command failed:"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text

      - name: Health check
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "::add-mask::$PUBLIC_IP"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://$PUBLIC_IP/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Healthy"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: /health did not return 200"
          exit 1
name: Terraform checks

on:
  pull_request:
    paths:
      - "terraform/**"
      - "bootstrap/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate main stack
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate bootstrap stack
        working-directory: bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: tflint --recursive

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true

  plan:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_alert_email: ci-plan@example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-south-2

      - name: Terraform plan (summary only)
        working-directory: terraform
        run: |
          terraform init -input=false
          set +e
          terraform plan -input=false -lock=false -no-color > "$RUNNER_TEMP/plan.txt" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "terraform plan failed. Last lines:"
            tail -n 25 "$RUNNER_TEMP/plan.txt"
            exit 1
          fi
          grep -E '^(Plan:|No changes)' "$RUNNER_TEMP/plan.txt" | tee -a "$GITHUB_STEP_SUMMARY"